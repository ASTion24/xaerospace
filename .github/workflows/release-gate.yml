name: Release Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and wheel smoke (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-2022
            python: "3.10"
          - os: windows-2022
            python: "3.11"
          - os: windows-2022
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: python -m pip install uv==0.12.4

      - name: Install project
        run: uv sync --extra test --extra release --python ${{ matrix.python }}

      - name: Verify lock file
        run: uv lock --check

      - name: Static checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Deterministic unit tests
        run: >-
          uv run pytest -q
          tests/test_aircraft_config.py
          tests/test_attitude_config.py
          tests/test_cli.py
          tests/test_config.py
          tests/test_launch_config.py
          tests/test_orbit_config.py
          tests/test_parameter_definitions.py
          tests/test_paths.py
          tests/test_protocol.py
          tests/test_provider_config.py
          tests/test_task_families.py
          tests/test_tudat_setup.py

      - name: Build and smoke-test wheel
        env:
          SOURCE_DATE_EPOCH: "1704067200"
        run: |
          uv build --wheel --out-dir dist
          uv run python scripts/wheel_smoke.py dist/xaerospace-*.whl

  full-physics:
    name: Four-backend physics gate (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.12.4

      - name: Install project
        run: uv sync --extra test --extra release --python 3.12

      - name: Cache pinned TudatPy runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xaerospace-home/runtime/tudat
          key: tudatpy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/tudatpy-*-lock.txt', 'src/aerospace_simulator/tudat_setup.py') }}

      - name: Install pinned TudatPy runtime
        env:
          XAEROSPACE_HOME: ${{ runner.temp }}/xaerospace-home
        run: uv run xaerospace setup-tudatpy

      - name: Run complete release gate
        env:
          XAEROSPACE_HOME: ${{ runner.temp }}/xaerospace-home
        run: uv run python scripts/release_gate.py
